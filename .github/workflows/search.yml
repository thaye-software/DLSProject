# search pipeline: test ──► security-scan ──► publish (pushes to dev/main only).
# Runs only when search (or a stage it uses) changes, so search ships independently.
name: search

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/search/**"
      - "microservices/docs/contracts/**"
      - "microservices/docker-compose.yml"
      - ".github/workflows/search.yml"
      - ".github/workflows/execute-tests.yml"
      - ".github/workflows/security-scan.yml"
      - ".github/workflows/publish-image.yml"
      - "microservices/scripts/zap/**"
  pull_request:
    paths:
      - "microservices/search/**"
      - "microservices/docs/contracts/**"
      - "microservices/docker-compose.yml"
      - ".github/workflows/search.yml"
      - ".github/workflows/execute-tests.yml"
      - ".github/workflows/security-scan.yml"
      - ".github/workflows/publish-image.yml"
      - "microservices/scripts/zap/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/execute-tests.yml
    with:
      service: search

  security-scan:
    needs: test
    uses: ./.github/workflows/security-scan.yml
    with:
      service: search

  publish:
    needs: [test, security-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      service: search
