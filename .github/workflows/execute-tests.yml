# Reusable test stage for one Node/TypeScript microservice. Each service workflow calls it first, before
# security-scan.yml and publish-image.yml:
#
#   typecheck + build ──┬─► unit tests
#                       ├─► integration tests (Vitest + testcontainers)
#                       └─► system tests (whole compose stack, system-tests.yml)
#
# The cheap check runs first, so a commit that does not compile never starts the slower test jobs.
name: execute-tests

on:
  workflow_call:
    inputs:
      service:
        description: Folder under microservices/
        required: true
        type: string
    secrets:
      # Optional: the Stripe and Resend integration tests skip themselves when these are missing.
      STRIPE_SECRET_KEY:
        required: false
      RESEND_API_KEY:
        required: false
      RESEND_FROM_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  typecheck-build:
    name: Typecheck + build (${{ inputs.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: microservices/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Also covers the test files, which the build leaves out, so it goes first.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit tests (${{ inputs.service }})
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: microservices/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catalog, Orders and Users import their Prisma client from src/generated/, which is not committed.
      - name: Generate Prisma client
        run: if [ -f prisma.config.ts ]; then npx prisma generate; fi

      - name: Unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration tests (${{ inputs.service }})
    needs: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: microservices/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: if [ -f prisma.config.ts ]; then npx prisma generate; fi

      # Postgres, MongoDB, Redis and RabbitMQ come from testcontainers, using the runner's Docker.
      - name: Integration tests
        run: npm run test:integration
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'onboarding@resend.dev' }}

  system-tests:
    needs: typecheck-build
    uses: ./.github/workflows/system-tests.yml
