name: Hit Expiration Webhook

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # runs every 30 minutes

jobs:
  call_webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Call expiration endpoint
        run: |
          curl -X PATCH \
            -H "x-limitedwatches-secret: ${{ secrets.LIMITED_WATCHES_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.LIMITED_WATCHES_EXPIRED_ORDERS_WEBHOOK_URL }}"
