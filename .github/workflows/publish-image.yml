# Reusable publish stage for one microservice: builds microservices/<service>/Dockerfile and pushes
# one image with two tags, ghcr.io/<owner>/dlsproject-<service>:latest and :<full commit SHA>.
# Each service workflow calls it last, only on pushes and only after execute-tests.yml and
# security-scan.yml passed. The calling job must grant `packages: write`; a reusable workflow
# cannot raise its caller's permissions.
name: publish-image

on:
  workflow_call:
    inputs:
      service:
        description: Folder under microservices/
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish image (${{ inputs.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also adds the OCI labels; org.opencontainers.image.source links the package to this repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dlsproject-${{ inputs.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: microservices/${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
