# Starts every microservice together with docker compose (fake Stripe, Resend and Supabase) and runs the
# cross-service journeys in microservices/system-tests against it: checkout, cancellation, fulfilment,
# account deletion, search and messaging, each with its failure paths.
name: system-tests

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/**"
      - ".github/workflows/system-tests.yml"
  pull_request:
    paths:
      - "microservices/**"
      - ".github/workflows/system-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: microservices/system-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/system-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every image builds in parallel (two npm ci each), so one dropped registry connection
      # (npm ECONNRESET) cancels the whole build. Finished layers stay cached, so a retry only
      # redoes what failed.
      - name: Build images
        run: |
          for attempt in 1 2 3; do
            npm run stack:build && exit 0
            echo "::warning::docker compose build failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1

      - name: Start stack
        run: npm run stack:up

      - name: Run system tests
        run: npm test

      - name: Service logs
        if: ${{ failure() }}
        run: npm run --silent stack:logs

      - name: Stop stack
        if: ${{ always() }}
        run: npm run stack:down
