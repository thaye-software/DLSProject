name: zap

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: microservices
    env:
      # Every service in the compose files sits behind profiles: ["${START_X:-true}"].
      # Locally microservices/.env (from .env.example) sets this; without it only rabbitmq starts.
      COMPOSE_PROFILES: "true"
      # Catalog, Orders and Payment sign and verify service JWTs with this shared secret.
      INTERNAL_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      # The user the API scans act as (the gateway's X-User-Id / X-User-Email).
      ZAP_USER_ID: 0b3c5a1e-7f2d-4c9a-8e61-2d4f7a9b1c03
      ZAP_USER_EMAIL: zap@example.com
    steps:
      - uses: actions/checkout@v7

      - name: Configure services with fake providers
        run: |
          cat > catalog/.env <<EOF
          INTERNAL_JWT_SECRET=$INTERNAL_JWT_SECRET
          EOF
          cat > orders/.env <<EOF
          INTERNAL_JWT_SECRET=$INTERNAL_JWT_SECRET
          EOF
          cat > payments/.env <<EOF
          PAYMENT_PROVIDER=fake
          ORDERS_URL=http://orders:3000
          INTERNAL_JWT_SECRET=$INTERNAL_JWT_SECRET
          EOF
          cat > emails/.env <<'EOF'
          MAILER=fake
          EOF

      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      # --wait only covers the containers that were created, so check every scan target answers.
      - name: Check services are up
        id: up
        run: |
          docker compose ps
          for port in 3000 3002 3003 3006 3007; do
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 \
              "http://localhost:$port/health" > /dev/null
            echo "port $port healthy"
          done

      # ---------------------------------------------------------------------------------------------
      # Baseline scans: passive, only what ZAP finds by crawling from / (response headers, 404s).
      # Each scan runs even if an earlier scan failed, so every service gets a report.
      # ---------------------------------------------------------------------------------------------
      - name: ZAP Baseline Scan (orders)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          artifact_name: zap_scan_orders

      - name: ZAP Baseline Scan (catalog)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3002
          allow_issue_writing: false
          artifact_name: zap_scan_catalog

      - name: ZAP Baseline Scan (search)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3003
          allow_issue_writing: false
          artifact_name: zap_scan_search

      - name: ZAP Baseline Scan (payment)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3006
          allow_issue_writing: false
          artifact_name: zap_scan_payment

      - name: ZAP Baseline Scan (notif)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3007
          allow_issue_writing: false
          artifact_name: zap_scan_notif

      # ---------------------------------------------------------------------------------------------
      # API scans: every operation in docs/contracts/openapi.yaml, with active attacks
      # (SQL injection, XSS, path traversal, ...), authenticated, against real records.
      # ---------------------------------------------------------------------------------------------
      - name: Seed test data
        id: data
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          # The runtime image has no tsx for `npm run db:seed`, so call the compiled seed directly.
          docker compose exec -T catalog node --input-type=module -e '
            import { createDatabase } from "./dist/adapters/db/prisma.js";
            import { seedCatalog, SEEDED_PRODUCT_ID } from "./dist/adapters/db/seed.js";
            const database = createDatabase(process.env.DATABASE_URL);
            await seedCatalog(database);
            await database.$disconnect();
            console.log("seeded product " + SEEDED_PRODUCT_ID);'

          # One RESERVED order owned by the scan user, created from the contract's own request example.
          yq -o=json '.paths["/orders"].post.requestBody.content["application/json"].example' docs/contracts/openapi.yaml \
            | curl --fail-with-body --silent --show-error -X POST http://localhost:3000/orders \
                -H "content-type: application/json" \
                -H "idempotency-key: $(cat /proc/sys/kernel/random/uuid)" \
                -H "x-user-id: $ZAP_USER_ID" -H "x-user-email: $ZAP_USER_EMAIL" \
                --data-binary @- > "$RUNNER_TEMP/order.json"
          jq '{order_id, status}' "$RUNNER_TEMP/order.json"
          echo "ORDER_ID=$(jq -er .order_id "$RUNNER_TEMP/order.json")" >> "$GITHUB_ENV"
          echo "PRODUCT_ID=$(jq -er '.items[0].product_id' "$RUNNER_TEMP/order.json")" >> "$GITHUB_ENV"

      # One spec per service, pointed at its auth proxy, with order_id/product_id set to the records above.
      # ZAP runs in Docker with the workspace mounted at /zap/wrk, so the specs go inside the workspace.
      - name: Build per-service API specs
        id: specs
        if: ${{ !cancelled() && steps.data.outcome == 'success' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.zap"
          yq -o=json docs/contracts/openapi.yaml > "$GITHUB_WORKSPACE/.zap/openapi.json"
          for entry in Orders:4000:orders Catalog:4002:catalog Search:4003:search Payment:4006:payment Notif:4007:notif; do
            IFS=: read -r tag port name <<< "$entry"
            node scripts/zap/service-spec.js "$GITHUB_WORKSPACE/.zap/openapi.json" "$tag" \
              "http://localhost:$port" "$GITHUB_WORKSPACE/.zap/$name.json"
          done

      # Port 4xxx -> 3xxx, adding the gateway's user headers and, for internal routes, a service JWT
      # signed per request (services reject tokens older than 60 s; a scan takes minutes).
      - name: Start gateway stand-ins
        id: proxies
        if: ${{ !cancelled() && steps.specs.outcome == 'success' }}
        run: |
          proxy() { nohup node scripts/zap/auth-proxy.js "$@" > "$RUNNER_TEMP/proxy-$1.log" 2>&1 & }
          proxy 4000 http://localhost:3000 payment orders   # GET /internal/orders/{id}/payment-details
          proxy 4002 http://localhost:3002 orders catalog   # /internal/reservations
          proxy 4003 http://localhost:3003
          proxy 4006 http://localhost:3006
          proxy 4007 http://localhost:3007
          for port in 4000 4002 4003 4006 4007; do
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
              "http://localhost:$port/health" > /dev/null
            echo "proxy $port up"
          done

      # Payment first: it needs the order still RESERVED, and the orders scan cancels and re-statuses it.
      - name: ZAP API Scan (payment)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: /zap/wrk/.zap/payment.json
          format: openapi
          allow_issue_writing: false
          artifact_name: zap_api_scan_payment

      - name: ZAP API Scan (catalog)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: /zap/wrk/.zap/catalog.json
          format: openapi
          allow_issue_writing: false
          artifact_name: zap_api_scan_catalog

      - name: ZAP API Scan (search)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: /zap/wrk/.zap/search.json
          format: openapi
          allow_issue_writing: false
          artifact_name: zap_api_scan_search

      - name: ZAP API Scan (notif)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: /zap/wrk/.zap/notif.json
          format: openapi
          allow_issue_writing: false
          artifact_name: zap_api_scan_notif

      - name: ZAP API Scan (orders)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: /zap/wrk/.zap/orders.json
          format: openapi
          allow_issue_writing: false
          artifact_name: zap_api_scan_orders

      - name: Service logs
        if: ${{ failure() }}
        run: |
          docker compose logs
          for log in "$RUNNER_TEMP"/proxy-*.log; do [ -f "$log" ] && { echo "--- $log"; cat "$log"; }; done

      - name: Stop stack
        if: ${{ always() }}
        run: docker compose down --volumes
