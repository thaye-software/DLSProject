name: emails

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/emails/**"
      - ".github/workflows/emails.yml"
  pull_request:
    paths:
      - "microservices/emails/**"
      - ".github/workflows/emails.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/emails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/emails/package-lock.json

      - run: npm ci

      - run: npm run typecheck --if-present

      - name: Vitest
        run: npm test

