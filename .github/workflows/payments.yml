name: payments

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/payments/**"
      - "microservices/docs/contracts/**"
      - ".github/workflows/payments.yml"
      - ".github/workflows/_node-service.yml"
  pull_request:
    paths:
      - "microservices/payments/**"
      - "microservices/docs/contracts/**"
      - ".github/workflows/payments.yml"
      - ".github/workflows/_node-service.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: payments
    secrets:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
