name: Database Migrations (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        type: string

      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'

      npm-script:
        description: 'NPM script to run for migrations'
        required: false
        type: string
        default: 'db:migrate'
    secrets:
      database-url:
        description: 'Database connection URL'
        required: true

jobs:
  migrate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      

      - name: Run migrations (develop)
        if: github.ref == 'refs/heads/dev'
        env:
          DATABASE_URL_DEV: ${{ secrets.database-url }}
        run: |
          set -e
          OUTPUT=$(npm run ${{ inputs.npm-script }} 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Error"; then
            echo "Migration failed for ${{ inputs.environment }}"
            exit 1
          fi
          echo "Migration completed successfully for ${{ inputs.environment }}"
      
      - name: Run migrations (production)
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL_PROD: ${{ secrets.database-url }}
        run: |
          set -e
          OUTPUT=$(npm run ${{ inputs.npm-script }} 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Error"; then
            echo "Migration failed for ${{ inputs.environment }}"
            exit 1
          fi
          echo "Migration completed successfully for ${{ inputs.environment }}"