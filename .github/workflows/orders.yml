name: orders

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/orders/**"
      - "microservices/docs/contracts/**"
      - ".github/workflows/orders.yml"
      - ".github/workflows/_node-service.yml"
  pull_request:
    paths:
      - "microservices/orders/**"
      - "microservices/docs/contracts/**"
      - ".github/workflows/orders.yml"
      - ".github/workflows/_node-service.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_node-service.yml
    with:
      service: orders
