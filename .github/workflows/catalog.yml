name: catalog

on:
  push:
    branches: [dev, main]
    paths:
      - "microservices/catalog/**"
      - "microservices/docker-compose.yml"
      - "microservices/orders/docker-compose.yml"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/_node-service.yml"
  pull_request:
    paths:
      - "microservices/catalog/**"
      - "microservices/docker-compose.yml"
      - "microservices/orders/docker-compose.yml"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/_node-service.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: write # for the publish job in _node-service.yml
    uses: ./.github/workflows/_node-service.yml
    with:
      service: catalog
