# Reusable CI for the Node/TypeScript microservices: test (Vitest + testcontainers), then, on a push
# to dev or main, publish the Docker image to GHCR.
# Called by the per-service workflows, which own the triggers and path filters. Callers must grant
# `packages: write` for the publish job; a reusable workflow cannot raise its caller's permissions.
name: node-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under microservices/
        required: true
        type: string
    secrets:
      # Optional: the Stripe and Resend integration tests skip themselves when these are missing.
      STRIPE_SECRET_KEY:
        required: false
      RESEND_API_KEY:
        required: false
      RESEND_FROM_EMAIL:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: microservices/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Postgres, MongoDB, Redis and RabbitMQ come from testcontainers, using the runner's Docker.
      - name: Integration tests
        run: npm run test:integration
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'onboarding@resend.dev' }}

      - name: Build
        run: npm run build

  # One image, two tags: ghcr.io/<owner>/dlsproject-<service>:latest and :<full commit SHA>.
  # Pull requests only run the tests, so `latest` never points at unmerged code.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also adds the OCI labels; org.opencontainers.image.source links the package to this repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dlsproject-${{ inputs.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: microservices/${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
