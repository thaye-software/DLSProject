name: Run Tests

on:
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

jobs:
  jest:
    name: Jest unit & integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: limited_watches_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/limited_watches_test
          APP_ENV: test
        run: npm run db:migrate

      - name: Run Jest tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/limited_watches_test
          APP_ENV: test
        run: npm run test

