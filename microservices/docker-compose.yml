include:
  - gateway/docker-compose.yml
  - frontend/docker-compose.yml
  - catalog/docker-compose.yml
  - orders/docker-compose.yml
  - payments/docker-compose.yml
  - emails/docker-compose.yml
  - search/docker-compose.yml
  - messaging/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:4-management
    # Run as rabbitmq so the healthcheck (docker exec) doesn't create .erlang.cookie as root and lock the server out.
    user: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
