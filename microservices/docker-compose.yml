include:
  - catalog/docker-compose.yml
  - orders/docker-compose.yml
  - payments/docker-compose.yml
  - emails/docker-compose.yml
  - search/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
