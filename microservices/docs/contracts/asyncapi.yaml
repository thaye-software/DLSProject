        subject:
          type: string
          format: uuid
          description: Id of the aggregate the event is about
        dataversion:
          const: 1
          description: "Schema version of `data`; breaking changes get a new event type (e.g. order_confirmed.v2)"
        correlationid:
          type: string
          format: uuid
          description: "Flow id, e.g. the order id for the checkout saga"
        causationid:
          type:
            - string
            - "null"
          format: uuid
          description: id of the event or request that caused this one
        data:
          "$ref": "#/components/schemas/PaymentFailedData"
