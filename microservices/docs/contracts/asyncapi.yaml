      required:
        - payment_intent_id
        - order_id
        - user_id
        - refund_request_id
        - amount
        - stripe_refund_id
        - refunded_at
    PaymentRefundedEvent:
      type: object
      additionalProperties: false
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - subject
        - dataversion
        - correlationid
        - data
      properties:
        specversion:
          const: "1.0"
        id:
          type: string
          format: uuid
          description: "Unique per event; idempotency key"
        source:
          const: /services/payment
        type:
          const: payment_refunded
          description: Same value as the AMQP routing key
        time:
          type: string
          format: date-time
          description: "ISO 8601, UTC"
        datacontenttype:
          const: application/json
        subject:
          type: string
          format: uuid
          description: Id of the aggregate the event is about
        dataversion:
          const: 1
          description: "Schema version of `data`; breaking changes get a new event type (e.g. order_confirmed.v2)"
        correlationid:
          type: string
          format: uuid
          description: "Flow id, e.g. the order id for the checkout saga"
        causationid:
          type:
            - string
            - "null"
          format: uuid
          description: id of the event or request that caused this one
        data:
          "$ref": "#/components/schemas/PaymentRefundedData"
