components:
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          minimum: 0
          description: "Amount in minor units (øre / cents). 1250.00 DKK = 125000."
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO 4217, e.g. DKK, EUR"
      required:
        - amount_minor
        - currency
      description: "Money is always an integer in minor units plus a currency; never a float."
    Address:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
        middle_name:
          type:
            - string
            - "null"
        last_name:
          type: string
        address_line_1:
          type: string
        address_line_2:
          type:
            - string
            - "null"
        city:
          type: string
        zip_code:
          type: string
        state_province:
          type:
            - string
            - "null"
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2
      required:
        - first_name
        - middle_name
        - last_name
        - address_line_1
        - address_line_2
        - city
        - zip_code
        - state_province
        - country_code
    Availability:
      type: string
      enum:
        - available
        - reserved
        - sold
        - hidden
      description: "hidden = visible is false (draft or withdrawn by an admin)"
    ProductImage:
      type: object
      additionalProperties: false
      properties:
        image_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        is_thumbnail:
          type: boolean
      required:
        - image_id
        - url
        - is_thumbnail
    Brand:
      type: object
      additionalProperties: false
      properties:
        brand_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
        - brand_id
        - name
        - slug
    WatchDetails:
      type: object
      additionalProperties: false
      properties:
        watch_id:
          type: string
          format: uuid
        brand:
          "$ref": "#/components/schemas/Brand"
        model:
          type: string
        slug:
          type: string
        reference:
          type: string
        year:
          type: integer
        condition:
          type: integer
        size_mm:
          type:
            - integer
            - "null"
        movement:
          type:
            - string
            - "null"
        glass_type:
          type:
            - string
            - "null"
        limited:
          type: boolean
        box:
          type: boolean
        papers:
          type: boolean
        bracelet_type:
          type:
            - string
            - "null"
        bracelet_color:
          type:
            - string
            - "null"
        dial_color:
          type:
            - string
            - "null"
      required:
        - watch_id
        - brand
        - model
        - slug
        - reference
        - year
        - condition
        - size_mm
        - movement
        - glass_type
        - limited
        - box
        - papers
        - bracelet_type
        - bracelet_color
        - dial_color
      description: Public watch data. serial_number and internal_id are deliberately NOT published.
    ProductSnapshot:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: "Aggregate version, +1 on every change. Consumers ignore an event whose version is not newer than the one they already stored."
        product_type:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          "$ref": "#/components/schemas/Money"
        stock:
          type: integer
          minimum: 0
        visible:
          type: boolean
        availability:
          "$ref": "#/components/schemas/Availability"
        watch:
          oneOf:
