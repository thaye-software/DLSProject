asyncapi: "3.0.0"
info:
  title: "Limited Watches – event contracts"
  version: "1.0.0"
  description: |-
    All asynchronous messages between the Limited Watches microservices.

    - Broker: RabbitMQ. One durable **topic exchange per publishing service**; routing key = event type.
    - Each consumer service has **one durable quorum queue per exchange** it listens to, named `<consumer>.<exchange>` (see `x-queue` on each receive operation), bound to the routing keys it needs, with a dead-letter queue `<queue>.dlq`.
    - Envelope: CloudEvents 1.0, structured JSON mode (content type application/cloudevents+json). `id` is the idempotency key: consumers store processed ids (inbox table) and skip duplicates.
    - Delivery is at-least-once: producers with a database write the event to an outbox table in the same DB transaction as the state change and publish with publisher confirms; consumers ack manually after processing and must be idempotent. Payment and Notif are stateless; README section 3 explains how they meet the same guarantees.
    - See docs/contracts/README.md for the full conventions.
defaultContentType: application/cloudevents+json
servers:
  rabbitmq:
    host: "rabbitmq:5672"
    protocol: amqp
    protocolVersion: "0.9.1"
    description: Internal RabbitMQ broker (not reachable from the internet)
channels:
  UserDeleted:
    address: user_deleted
    title: user.events / user_deleted
    description: "Routing key `user_deleted` on topic exchange `user.events`."
    messages:
      UserDeleted:
        "$ref": "#/components/messages/UserDeleted"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: user.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: "0.3.0"
