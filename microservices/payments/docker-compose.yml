services:
  payment:
    profiles: ["${START_PAYMENT:-true}"]
    build: .
    env_file:
      - path: ./.env
        required: false
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDERS_URL: http://orders:3000
    ports:
      - "3006:3006"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 3s
      retries: 3
