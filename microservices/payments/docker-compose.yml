services:
  payment:
    profiles: ["${START_PAYMENT:-true}"]
    build: .
    env_file:
      - path: ./.env
        required: false
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDERS_URL: http://orders:3000
    ports:
      - "3006:3006"
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Restarted after a crash (non-zero exit), but not when Docker Desktop starts: on shutdown the service
    # gets SIGTERM and exits 0, so Docker has nothing to restart. Start the stack with docker compose up.
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 3s
      retries: 3
