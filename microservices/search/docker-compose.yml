services:
  search-db:
    profiles: ["${START_SEARCH:-true}"]
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - search-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  search-cache:
    profiles: ["${START_SEARCH:-true}"]
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  search:
    profiles: ["${START_SEARCH:-true}"]
    build: .
    env_file:
      - path: ./.env
        required: false
    environment:
      MONGODB_URL: mongodb://search-db:27017/search
      REDIS_URL: redis://search-cache:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      search-db:
        condition: service_healthy
      search-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Restarted after a crash (non-zero exit), but not when Docker Desktop starts: on shutdown the service
    # gets SIGTERM and exits 0, so Docker has nothing to restart. Start the stack with docker compose up.
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  search-db-data:
