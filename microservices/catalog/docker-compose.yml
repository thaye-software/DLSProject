services:
  catalog-db:
    profiles: ["${START_CATALOG:-true}"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "catalog", "-d", "catalog"]
      interval: 5s
      timeout: 5s
      retries: 12

  catalog:
    profiles: ["${START_CATALOG:-true}"]
    build: .
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql://catalog:catalog@catalog-db:5432/catalog
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Restarted after a crash (non-zero exit), but not when Docker Desktop starts: on shutdown the service
    # gets SIGTERM and exits 0, so Docker has nothing to restart. Start the stack with docker compose up.
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  catalog-db-data:
