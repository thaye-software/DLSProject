apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  labels:
    app: gateway
type: Opaque
stringData:
  # Placeholders. Use your project's Supabase URL and its legacy JWT secret (optional: leave
  # SUPABASE_JWT_SECRET empty if the project only uses asymmetric signing keys).
  SUPABASE_URL: https://replace-with-project-ref.supabase.co
  SUPABASE_JWT_SECRET: replace-with-at-least-32-random-characters
