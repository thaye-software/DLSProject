apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: dls/gateway:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: SUPABASE_URL
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: SUPABASE_JWT_SECRET
                  optional: true
            - name: ORDERS_URL
              value: http://orders:3000
            - name: PAYMENT_URL
              value: http://payment:3006
            - name: CATALOG_URL
              value: http://catalog:3002
            - name: SEARCH_URL
              value: http://search:3003
            - name: MESSAGING_URL
              value: http://messaging:3004
            - name: NOTIF_URL
              value: http://notif:3007
            - name: CORS_ORIGINS
              value: http://localhost:3100,http://localhost:30100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
