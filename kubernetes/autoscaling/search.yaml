# KEDA creates and runs the HPA keda-hpa-search for the search Deployment from this ScaledObject.
# How to change the numbers: kubernetes/autoscalingguide.txt
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: search
  labels:
    app: search
spec:
  scaleTargetRef:
    name: search
  minReplicaCount: 1
  maxReplicaCount: 4
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
