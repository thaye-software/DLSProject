apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-users
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z users 3005; do sleep 2; done
      containers:
        - name: auth
          image: dls/auth:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            # No Supabase project: "Bearer fake:<user id>" signs in as that user, unchecked. Local cluster only.
            - name: TOKEN_VERIFIER
              value: fake
            - name: USERS_URL
              value: http://users:3005
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: INTERNAL_JWT_SECRET
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
