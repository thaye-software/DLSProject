apiVersion: v1
kind: Secret
metadata:
  name: orders-secret
  labels:
    app: orders
type: Opaque
stringData:
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orders
  POSTGRES_DB: orders
  DATABASE_URL: postgresql://orders:orders@orders-db:5432/orders
  # Same value as Catalog and Payment. Local placeholder from orders/.env.example.
  INTERNAL_JWT_SECRET: replace-with-at-least-32-random-characters
