apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z orders-db 5432 && nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: orders
          image: ghcr.io/thaye-software/dlsproject-orders:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: CATALOG_URL
              value: http://catalog:3002
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orders-secret
                  key: INTERNAL_JWT_SECRET
            - name: SHIPPING_PRICE_MINOR
              value: "30000"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
