apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels:
    app: grafana
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: dls
        folder: DLS
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
