apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: warn

    # How far each file has been read, kept on the node so a restart does not resend old lines.
    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only pods on this Promtail's node (HOSTNAME is the node name, see the DaemonSet env).
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          # The kubelet writes each container's stdout/stderr to /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

        pipeline_stages:
          # The node wraps each line in Docker's JSON format or in the CRI format, depending on the
          # container runtime. The json stage only matches the first, the regex stage only the second.
          - json:
              expressions:
                output: log
                stream: stream
                timestamp: time
          - regex:
              expression: '^(?P<timestamp>\S+) (?P<stream>stdout|stderr) (?P<flags>[FP]) (?P<output>.*)$'
          - labels:
              stream:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
          - output:
              source: output
          # The services log JSON (pino); its level becomes a label so Grafana can filter on it.
          # Lines that are not JSON (databases, RabbitMQ) get no level label.
          - json:
              expressions:
                level: level
          - labels:
              level:
