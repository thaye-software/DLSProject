# Prometheus' settings. For now it only scrapes itself: the k6 load test pushes its results in
# (remote write, see deployment.yaml), and the services do not expose /metrics yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
