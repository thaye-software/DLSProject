apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: payment
          image: ghcr.io/thaye-software/dlsproject-payments:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: ORDERS_URL
              value: http://orders:3000
            - name: PAYMENT_PROVIDER
              value: fake
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: INTERNAL_JWT_SECRET
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
