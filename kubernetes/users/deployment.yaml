apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z users-db 5432 && nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: users
          image: ghcr.io/thaye-software/dlsproject-users:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: users-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: users-secret
                  key: INTERNAL_JWT_SECRET
            - name: SUPABASE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: users-secret
                  key: SUPABASE_WEBHOOK_SECRET
            # No Supabase project: Supabase accounts and avatar files are not touched, avatars get a made-up URL.
            - name: IDENTITY_PROVIDER
              value: fake
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
