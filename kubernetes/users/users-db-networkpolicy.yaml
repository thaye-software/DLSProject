# Only Users's pods may connect to its Postgres; every other pod is refused.
# Same rule as the users-data network in microservices/users/docker-compose.yml.
# Enforced only when the cluster's network plugin supports NetworkPolicy (see setupguide.txt).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-db
  labels:
    app: users-db
spec:
  podSelector:
    matchLabels:
      app: users-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users
      ports:
        - protocol: TCP
          port: 5432
