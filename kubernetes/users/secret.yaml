apiVersion: v1
kind: Secret
metadata:
  name: users-secret
  labels:
    app: users
type: Opaque
stringData:
  POSTGRES_USER: users
  POSTGRES_PASSWORD: users
  POSTGRES_DB: users
  DATABASE_URL: postgresql://users:users@users-db:5432/users
  # Same value as Auth, Catalog, Orders and Payment. Local placeholder from users/.env.example.
  INTERNAL_JWT_SECRET: replace-with-at-least-32-random-characters
  # No Supabase project in this cluster, so no webhook calls it. Users still needs a 32+ character value.
  SUPABASE_WEBHOOK_SECRET: replace-with-at-least-32-random-characters
