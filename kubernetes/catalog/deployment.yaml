apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z catalog-db 5432 && nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: catalog
          image: dls/catalog:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-secret
                  key: INTERNAL_JWT_SECRET
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
