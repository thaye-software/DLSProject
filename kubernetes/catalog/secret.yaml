apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  labels:
    app: catalog
type: Opaque
stringData:
  POSTGRES_USER: catalog
  POSTGRES_PASSWORD: catalog
  POSTGRES_DB: catalog
  DATABASE_URL: postgresql://catalog:catalog@catalog-db:5432/catalog
  # Same value as Orders and Payment. Local placeholder from orders/.env.example.
  INTERNAL_JWT_SECRET: replace-with-at-least-32-random-characters
