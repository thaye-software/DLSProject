apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-cache
  labels:
    app: search-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-cache
  template:
    metadata:
      labels:
        app: search-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
