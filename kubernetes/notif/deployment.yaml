apiVersion: apps/v1
kind: Deployment
metadata:
  name: notif
  labels:
    app: notif
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notif
  template:
    metadata:
      labels:
        app: notif
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do sleep 2; done
      containers:
        - name: notif
          image: dls/notif:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3007
          env:
            - name: PORT
              value: "3007"
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: MAILER
              value: fake
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
