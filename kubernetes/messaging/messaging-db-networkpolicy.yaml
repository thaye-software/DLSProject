# Only Messaging's pods may connect to its MongoDB; every other pod is refused.
# Same rule as the messaging-data network in microservices/messaging/docker-compose.yml.
# Enforced only when the cluster's network plugin supports NetworkPolicy (see setupguide.txt).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messaging-db
  labels:
    app: messaging-db
spec:
  podSelector:
    matchLabels:
      app: messaging-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: messaging
      ports:
        - protocol: TCP
          port: 27017
