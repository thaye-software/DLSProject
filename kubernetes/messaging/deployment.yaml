apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging
  labels:
    app: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging
  template:
    metadata:
      labels:
        app: messaging
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z messaging-db 27017 && nc -z rabbitmq 5672 && nc -z catalog 3002; do sleep 2; done
      containers:
        - name: messaging
          image: dls/messaging:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: MONGODB_URL
              value: mongodb://messaging-db:27017/messaging
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: CATALOG_URL
              value: http://catalog:3002
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
